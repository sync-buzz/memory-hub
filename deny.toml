[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # RSA timing sidechannel (Marvin Attack) in `rsa`, which `age` pulls in for
    # its `ssh` feature. There is no fixed release — the advisory itself says
    # "No safe upgrade is available!" — and the feature is not optional here:
    # reusing the SSH key somebody already has is how encrypted projects are
    # unlocked.
    #
    # What it takes to exploit: many timed decryptions of chosen ciphertexts
    # against one RSA private key. Unlocking happens locally, with a key file
    # the person running it already holds, and an RSA key is reachable only if
    # they point `memory_unlock` at one — Memory Hub generates X25519 and
    # documents ed25519. Revisit when `rsa` publishes a fix.
    { id = "RUSTSEC-2023-0071", reason = "no fixed release; RSA reachable only through a user-supplied RSA SSH identity" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "FSL-1.1-MIT",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
