[workspace]
resolver = "2"
members = [
    "crates/git-memory",
    "crates/git-memory-contract",
    "crates/git-memory-core",
    "crates/git-memory-mcp",
    "crates/git-memory-reconcile",
    "crates/git-memory-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "FSL-1.1-MIT"
authors = ["Di Arch <owner@sync.buzz>"]
repository = "https://github.com/sync-buzz/git-memory"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

[workspace.dependencies]
clap = { version = "4.5.46", features = ["derive"] }
fs2 = "0.4.3"
git2 = { version = "0.21.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"

[profile.release]
lto = "thin"
strip = "symbols"
